# Configuración de StreamerChat - Kick Integration Plugin

kick:
  # Opcional: Solo si deseas usar tu propia App en dev.kick.com. Si se deja vacío, el plugin usará las credenciales integradas por defecto.
  client_id: ""
  client_secret: ""
  # URL de callback para OAuth
  redirect_uri: "http://localhost:8080/auth/callback"
  # Puerto interno para la autorización de OAuth2 (por defecto: 8080)
  auth_server_port: 8080
  # Permisos solicitados a Kick
  scopes: "user:read chat:write"

# Formato del chat en Minecraft usando Kyori MiniMessage
chat:
  # Formato con el que se mostrará el mensaje en Minecraft
  # Variables disponibles:
  #   {streamer}       -> Nombre del streamer del canal
  #   {badge}          -> Rango/Insignia formateada de Kick
  #   {user}           -> Nombre en texto plano del usuario que envió el mensaje
  #   {user_color}     -> Color HEX asignado al usuario en Kick (ej: #53FC18 o #FF5733)
  #   {user_formatted} -> Nombre del usuario formateado automáticamente con su color de Kick (<color:#HEX>Usuario</color>)
  #   {message}        -> Mensaje de chat
  #
  # Ejemplo usando el color HEX dinámico del usuario en Kick:
  format: "<green>[Kick]</green> {badge} <color:{user_color}>{user}</color><gray>:</gray> <white>{message}</white>"

# Formato de insignias / rangos de Kick en el chat de Minecraft (MiniMessage)
badges:
  broadcaster: "<red>[STREAMER]</red>"
  moderator: "<dark_green>[MOD]</dark_green>"
  subscriber: "<light_purple>[SUB]</light_purple>"
  vip: "<dark_purple>[VIP]</dark_purple>"
  og: "<gold>[OG]</gold>"
  default: "<gray>[VIEWER]</gray>"

# Opciones avanzadas
settings:
  # Reconexión automática de WebSocket en segundos
  reconnect_interval_seconds: 5
  # Guardar tokens de manera persistente en plugins/StreamerChat/users.yml
  save_sessions: true
